[project]
name = "site-dna"
version = "0.1.0"
description = "Site DNA - AI-powered website intelligence and strategic auditing platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "crawl4ai>=0.9.5",
    "crewai[google-genai]>=1.15.37",
    "defusedxml>=0.7.1",
    "fastapi>=0.162.0",
    "google-genai>=1.65.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pillow>=13.0.0",
    "playwright>=1.64.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "selectolax>=1.0.2",
    "tldextract>=5.4.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
site-dna = "site_dna.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests requiring live external services/credentials (deselect with '-m \"not integration\"')",
    "live: marks tests that hit the real internet (skipped by default)",
    "browser: marks tests that require a Playwright Chromium browser",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
